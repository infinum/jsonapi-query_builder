name: spec

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  rake-spec:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        ruby: ['3.2', '3.3', '3.4']

    steps:
      - uses: actions/checkout@v2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: rake spec
        run: bundle exec rake spec
